<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <script src="scripts/script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div class="calculator">
      <div class="screen">
        <div class="operation"></div>
        <div class="operationResult">0</div>
      </div>
      <div class="buttons">
        <button class="operatorBtn">%</button>
        <button class="operatorBtn clearBtn clearEntry">CE</button>
        <button class="operatorBtn clearBtn clear">C</button>
        <button class="operatorBtn">
          <img src="./assets/backspace.png" alt="backspace" />
        </button>

        <button class="operatorBtn"><sup>1</sup>&frasl;<sub>x</sub></button>
        <button class="operatorBtn">x<sup>2</sup></button>
        <button class="operatorBtn"><sup>2</sup>&radic;x</button>
        <button class="operatorBtn">&divide;</button>

        <button class="operandBtn">7</button>
        <button class="operandBtn">8</button>
        <button class="operandBtn">9</button>
        <button class="operatorBtn">x</button>

        <button class="operandBtn">4</button>
        <button class="operandBtn">5</button>
        <button class="operandBtn">6</button>
        <button class="operatorBtn">-</button>

        <button class="operandBtn">1</button>
        <button class="operandBtn">2</button>
        <button class="operandBtn">3</button>
        <button class="operatorBtn">+</button>

        <button class="operandBtn">+/-</button>
        <button class="operandBtn">0</button>
        <button class="operandBtn">,</button>
        <button class="equalBtn">=</button>
      </div>
    </div>
  </body>
</html>
